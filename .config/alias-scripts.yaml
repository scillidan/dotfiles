## https://github.com/scillidan/scripts

abbr: bash llm-abbreviate.sh
cmnt: bash llm-comment.sh
expl: bash llm-explain.sh
gh-del-workflow-run: bash gh-del-workflow-run.sh
gh-disable-workflow: bash gh-disable-workflow.sh
lambda: bash llm-lambda_replace.sh
ob: bash urls-open.sh
sum: bash llm-summarize.sh
trans: bash llm-translate.sh
tranx: bash llm-translate-stdin.sh

## eilmeldung
elm: eilmeldung-theme

## fzf
fg: bash fzf-ripgrep.sh
ffg: bash fzf-ripgrep.sh "$USERHOME/Share/files"
fsdcv: wezterm cli split-pane --right -- bash fzf-sdcv.sh
ftldr: wezterm cli split-pane --right -- bash fzf-tldr.sh
fbkm: wezterm cli split-pane --right -- bash fzf-bookmarks.sh
ffsdcv: bash fzf-sdcv.sh
fftldr: bash fzf-tldr.sh
ffbkm: bash fzf-bookmarks.sh
ffman: bash fzf-files.sh "$USERHOME/Local/Document/man"
ffdevdocs: bash fzf-files.sh "$USERHOME/Local/Document/devdocs"
fftables: bash fzf-files.sh "$USERHOME/Share/files/tables"

## Git
git-init: bash git-init.sh
git-push: bash git-push.sh
git-retag: bash git-retag.sh
git-sync-upstream: bash git-sync-upstream.sh

## GitHub CLI
ips: bash gh-issue-pr.sh
ghrs: gh release list
ghrd: gh release delete --cleanup-tag -y
ntfy: gh-notify -ap -n 10
tidy: gh-tidy

## Neovide
nvd: bash _neovide.sh

## terminal-theme-switch
oc: opencode-theme --continue $* & reset

## yazi
y: yazi-cd $* && reset
