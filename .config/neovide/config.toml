# neovim-bin = "/usr/bin/nvim"
# maximized = false
fork = false
frame = "none"
idle = true
mouse-cursor-icon = "arrow"
no-multigrid = false
srgb = false
tabs = false
title-hidden = true
vsync = true
wsl = false
size = "1250x720"

[font]
normal = [ "Sarasa Term SC Nerd" ]
size = 9.5

[box-drawing]
mode = "font-glyph"

[box-drawing.sizes]
default = [1, 2]
