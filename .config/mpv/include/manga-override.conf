# Overrides for upstream mpv-image-config, which assumes the built-in OSC and
# evaluates its loop-short condition before images have a duration.
[video]
osc=no

[loop-short]
profile-cond=p['current-tracks/video/image'] == false and duration and duration < 30 and image_display_duration == math.huge

[manga]
profile-cond=path and require 'mp.utils'.join_path(working_directory, path):find('manga')
