# Upstream hdr-toys evaluates this before video-out-params/max-luma exists,
# which errors on SDR files. Keep the Dolby Vision P5 detection but guard nil.
[dovi-p5]
profile-cond=get("video-params/primaries") == "bt.709" and get("video-params/gamma") == "bt.1886" and (get("video-out-params/max-luma") or 0) > 203
